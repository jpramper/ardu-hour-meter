[env:uno]
platform = atmelavr
board = uno
framework = arduino
test_ignore = test_native
build_src_filter = 
  +<*>
  -<native/>

lib_deps =
  wayoda/LedControl
  maniacbug/StandardCplusplus


[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = 
  +<*> 
  -<uno/>
